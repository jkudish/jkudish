name: Pest Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      pull-requests: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, bcmath, pdo_sqlite, pdo_pgsql
          coverage: none
          
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
            
      - name: Install dependencies
        run: |
          # Set composer to not use GitHub API for public repos
          composer config --global github-protocols https
          composer install --prefer-dist --no-progress --no-suggest --optimize-autoloader
        
      - name: Prepare Laravel application
        run: |
          cp .env.example .env
          php artisan key:generate
          
          # Configure git to avoid remote warnings
          git config --global init.defaultBranch main
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"
          
      - name: Run Pest tests
        id: test
        run: |
          set +e
          
          # Debug: Show current directory
          echo "Current directory: $(pwd)"
          
          # Suppress git warnings that might occur during tests
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS=/bin/echo
          
          # Ensure test output file is created
          touch test-output.txt
          
          # Run tests and capture output
          php artisan test --no-coverage 2>&1 | tee test-output.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          
          # Debug: Verify file was created
          echo "Test output file exists: $(ls -la test-output.txt 2>/dev/null || echo 'File not found')"
          
          # Ensure outputs are set
          echo "exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT
          
          # Extract test results
          if [ $TEST_EXIT_CODE -eq 0 ]; then
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi
          
          # Always exit successfully to allow the next step to run
          exit 0
          
      - name: Post test results to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Check if test output file exists
            const testOutputPath = path.join(process.cwd(), 'test-output.txt');
            if (!fs.existsSync(testOutputPath)) {
              console.log('Test output file not found, skipping comment');
              return;
            }
            
            const testOutput = fs.readFileSync(testOutputPath, 'utf8');
            const exitCode = '${{ steps.test.outputs.exit_code }}';
            const status = '${{ steps.test.outputs.status }}';
            
            let title, emoji, summary;
            
            if (status === 'passed') {
              emoji = '✅';
              title = 'All tests passed!';
              summary = 'All Pest tests completed successfully.';
            } else {
              emoji = '❌';
              title = 'Tests failed';
              summary = 'Some tests did not pass. See details below.';
            }
            
            // Extract failure details from output
            const lines = testOutput.split('\n');
            let failureDetails = [];
            let inFailure = false;
            let currentFailure = [];
            
            for (const line of lines) {
              if (line.includes('FAILED') && line.includes('Tests\\')) {
                if (currentFailure.length > 0) {
                  failureDetails.push(currentFailure.join('\n'));
                }
                inFailure = true;
                currentFailure = [line];
              } else if (inFailure) {
                if (line.trim() === '' || line.includes('Tests:') || line.includes('Duration:')) {
                  inFailure = false;
                  if (currentFailure.length > 0) {
                    failureDetails.push(currentFailure.join('\n'));
                    currentFailure = [];
                  }
                } else {
                  currentFailure.push(line);
                }
              }
            }
            
            if (currentFailure.length > 0) {
              failureDetails.push(currentFailure.join('\n'));
            }
            
            // Extract test summary
            const summaryMatch = testOutput.match(/Tests:\s+(\d+\s+\w+(?:,\s+\d+\s+\w+)*)/);
            const durationMatch = testOutput.match(/Duration:\s+([\d.]+s)/);
            
            let body = `## ${emoji} Test Results: ${title}\n\n`;
            body += `${summary}\n\n`;
            
            if (summaryMatch) {
              body += `**Summary:** ${summaryMatch[1]}`;
              if (durationMatch) {
                body += ` (${durationMatch[1]})`;
              }
              body += '\n\n';
            }
            
            if (failureDetails.length > 0) {
              body += '### Failed Tests\n\n';
              for (const failure of failureDetails) {
                body += '<details>\n';
                const firstLine = failure.split('\n')[0];
                const testName = firstLine.replace('FAILED', '').trim();
                body += `<summary>${testName}</summary>\n\n`;
                body += '```\n';
                body += failure;
                body += '\n```\n';
                body += '</details>\n\n';
              }
            }
            
            body += `---\n`;
            body += `*Generated by Pest Tests workflow at ${new Date().toISOString()}*\n`;
            body += `[View workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            
            // Post comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });